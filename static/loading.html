<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Teksting</title>
<!-- Loading screen for the app window (tekst/launch.py fills in __URL__ and __LANG__).
     A quiet line drawing of a typewriter types "Teksting" with a pale subtitle-yellow bar under it.
     Only soft, muted colours (from the app's tokens). Switches to the app once the server answers. -->
<style>
  :root {
    --paper: #edf1f4; --sheet: #ffffff; --stroke: #b9c4cd; --text: #7d8a95; --muted: #8f9aa4;
    --cue: #f1dd95; --key-down: #f1dd95;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #10171d; --sheet: #141d24; --stroke: #3b4a55; --text: #8796a2; --muted: #6f7e8a;
      --cue: #6e6237; --key-down: #6e6237; }
  }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  body { display: grid; place-items: center; font-family: var(--font-display); transition: opacity .25s ease; }
  body.out { opacity: 0; }
  main { display: grid; justify-items: center; gap: 16px; animation: in .4s ease-out both; }
  @keyframes in { from { opacity: 0; } }
  svg { width: 200px; height: auto; overflow: visible; }
  #caption { font-size: 12px; letter-spacing: .08em; color: var(--muted); }

  .line { fill: none; stroke: var(--stroke); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  #carriage { transition: transform .12s cubic-bezier(.3,.7,.4,1); }
  #carriage.return { transition: transform .45s cubic-bezier(.6,0,.3,1); }
  .key { fill: var(--paper); transition: transform .09s ease, fill .09s ease; }
  .key.down { transform: translateY(1.5px); fill: var(--key-down); }
  #bar { transition: width .12s ease; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 220 160" role="img" aria-label="Teksting">
    <!-- carriage: sheet + roller, slides left as letters are typed -->
    <g id="carriage">
      <rect x="62" y="10" width="96" height="72" rx="3" fill="var(--sheet)" class="line"/>
      <text id="typed" x="72" y="44" font-size="15" font-weight="500" fill="var(--text)"
        style="font-family: var(--font-display)"></text>
      <rect id="bar" x="72" y="51" width="0" height="3.5" rx="1.75" fill="var(--cue)"/>
      <rect x="46" y="78" width="128" height="10" rx="5" fill="var(--paper)" class="line"/>
      <circle cx="42" cy="83" r="4" fill="var(--paper)" class="line"/>
      <circle cx="178" cy="83" r="4" fill="var(--paper)" class="line"/>
    </g>
    <!-- body -->
    <path d="M38 96 H182 L194 148 Q195 152 191 152 H29 Q25 152 26 148 Z" fill="var(--paper)" class="line"/>
    <path d="M106 96 L110 100 L114 96" class="line"/>
    <g id="keys"></g>
    <rect id="space" class="key line" x="84" y="138" width="52" height="5" rx="2.5"/>
  </svg>
  <div id="caption"></div>
</main>

<script>
(function () {
  var URL = "__URL__", LANG = "__LANG__";
  var NS = "http://www.w3.org/2000/svg", WORD = "Teksting";
  var lang = LANG || navigator.language || "nb";
  document.getElementById("caption").textContent = /^(nb|no|nn)/i.test(lang) ? "Starter …" : "Starting …";

  // three rows of round keys on the body
  var keys = [], rows = [[7, 112], [6, 125]];
  rows.forEach(function (r, i) {
    for (var k = 0; k < r[0]; k++) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", (110 + (k - (r[0] - 1) / 2) * 15).toFixed(1));
      c.setAttribute("cy", r[1]);
      c.setAttribute("r", "3.6");
      c.setAttribute("class", "key line");
      document.getElementById("keys").appendChild(c);
      keys.push(c);
    }
  });
  keys.push(document.getElementById("space"));

  var typed = document.getElementById("typed"), bar = document.getElementById("bar");
  var carriage = document.getElementById("carriage");
  var TYPE_X = 110;  // the typing point (the yellow guide on the body)
  var line = 0, wordsDone = 0;

  function setCarriage(textWidth, returning) {
    // keep the end of the typed text under the guide: the carriage moves left as the line grows
    carriage.classList.toggle("return", !!returning);
    carriage.style.transform = "translateX(" + (TYPE_X - 72 - textWidth).toFixed(1) + "px)";
  }
  function press() {
    var k = keys[Math.floor(Math.random() * keys.length)];
    k.classList.add("down");
    setTimeout(function () { k.classList.remove("down"); }, 90);
  }
  function typeWord() {
    var i = 0;
    typed.textContent = "";
    bar.setAttribute("width", "0");
    setCarriage(0, true);
    setTimeout(function next() {
      i++;
      typed.textContent = WORD.slice(0, i);
      var w = typed.getComputedTextLength();
      bar.setAttribute("width", w.toFixed(1));
      setCarriage(w, false);
      press();
      // once the app is ready, finish the word quickly instead of making the user wait for it
      if (i < WORD.length) { setTimeout(next, ready ? 25 : 80 + Math.random() * 50); return; }
      wordsDone++;
      go();
      setTimeout(function () { line++; typeWord(); }, 700);  // carriage return, type again
    }, line ? 380 : 120);
  }

  var ready = false, left = false, t0 = Date.now();
  function go() {
    if (!ready || wordsDone < 1 || left) return;
    left = true;
    document.body.classList.add("out");
    setTimeout(function () { location.replace(URL); }, 250);
  }
  function ping() {
    fetch(URL + "api/ping", { mode: "no-cors", cache: "no-store" })
      .then(function () { ready = true; go(); })
      .catch(function () {
        if (Date.now() - t0 > 45000) {
          document.getElementById("caption").textContent = /^(nb|no|nn)/i.test(lang)
            ? "Teksting kom ikke i gang. Lukk vinduet og prøv igjen, eller send data\\teksting.log til den som ga deg appen."
            : "Teksting did not start. Close the window and try again, or send data\\teksting.log to whoever gave you the app.";
          return;
        }
        setTimeout(ping, 150);
      });
  }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    typed.textContent = WORD; wordsDone = 1;
    requestAnimationFrame(function () { bar.setAttribute("width", typed.getComputedTextLength()); });
  } else {
    typeWord();
  }
  ping();
})();
</script>
</body>
</html>
